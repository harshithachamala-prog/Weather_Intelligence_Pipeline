services:
    api:
      build: .
      image : weather_api
      ports:
        - "8000:8000"
      volumes:
        - ./data:/app/data
        - ./logs:/app/logs
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s

    scheduler: 
      build: . 
      image : weather_api
      command : python scheduler.py
      env_file:
        - .env
      volumes:
        - ./data:/app/data
        - ./logs:/app/logs
      restart: unless-stopped
    